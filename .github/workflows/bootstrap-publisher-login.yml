name: Bootstrap Publisher Login

on:
  push:
    branches: [main]
    paths:
      - 'automation/cloudflare-publisher/login-trigger.json'

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: automation/cloudflare-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read login target
        id: target
        run: |
          SITE="$(node -p "JSON.parse(require('fs').readFileSync('login-trigger.json','utf8')).site")"
          if [ "$SITE" != "kakuyomu" ] && [ "$SITE" != "nola" ]; then
            echo "Unsupported login target: $SITE"
            exit 1
          fi
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "Login target: $SITE"

      - name: Generate ephemeral login token
        id: login_token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set temporary Worker login secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOGIN_RUN_TOKEN: ${{ steps.login_token.outputs.token }}
        run: |
          printf '%s\n' "$LOGIN_RUN_TOKEN" | npx wrangler secret put LOGIN_RUN_TOKEN

      - name: Start human login handoff
        id: handoff
        timeout-minutes: 12
        shell: bash
        env:
          SITE: ${{ steps.target.outputs.site }}
          LOGIN_RUN_TOKEN: ${{ steps.login_token.outputs.token }}
        run: |
          sleep 5
          set +e
          HTTP_CODE="$(curl --silent --show-error \
            --max-time 700 \
            -X POST \
            -H "x-login-run-token: $LOGIN_RUN_TOKEN" \
            -o "$GITHUB_WORKSPACE/login-result.json" \
            -w '%{http_code}' \
            "https://novel-auto-publisher.itisnowornever271.workers.dev/login-handoff?site=$SITE")"
          CURL_EXIT=$?
          set -e

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "curl_exit=$CURL_EXIT" >> "$GITHUB_OUTPUT"

          if [ -f "$GITHUB_WORKSPACE/login-result.json" ]; then
            node - <<'NODE'
          const fs = require('fs');
          const p = process.env.GITHUB_WORKSPACE + '/login-result.json';
          try {
            const data = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(`Handoff finished: ok=${Boolean(data.ok)}, site=${data.site || 'unknown'}`);
          } catch {
            console.log('Handoff returned a non-JSON response.');
          }
          NODE
          fi

      - name: Verify saved session
        if: always()
        shell: bash
        env:
          SITE: ${{ steps.target.outputs.site }}
        run: |
          curl --silent --show-error --max-time 30 \
            "https://novel-auto-publisher.itisnowornever271.workers.dev/session-status?site=$SITE" \
            -o "$GITHUB_WORKSPACE/session-status.json" || true

      - name: Remove temporary Worker login secret
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '{"LOGIN_RUN_TOKEN":null}\n' | npx wrangler secret bulk || true

      - name: Record sanitized login status
        if: always()
        working-directory: .
        env:
          SITE: ${{ steps.target.outputs.site }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          HANDOFF_HTTP_CODE: ${{ steps.handoff.outputs.http_code }}
          HANDOFF_CURL_EXIT: ${{ steps.handoff.outputs.curl_exit }}
        run: |
          mkdir -p .deploy-status
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;

          const readJson = (name) => {
            try { return JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')); }
            catch { return null; }
          };

          const handoff = readJson('login-result.json');
          const session = readJson('session-status.json');

          const status = {
            service: 'novel-auto-publisher',
            site: process.env.SITE || null,
            run_id: process.env.RUN_ID,
            run_number: process.env.RUN_NUMBER,
            commit_sha: process.env.COMMIT_SHA,
            generated_at_utc: new Date().toISOString(),
            handoff_http_code: process.env.HANDOFF_HTTP_CODE || null,
            handoff_curl_exit: process.env.HANDOFF_CURL_EXIT || null,
            handoff_ok: Boolean(handoff?.ok),
            stored_session: Boolean(session?.hasStoredSession),
            session_meta: session?.meta || null,
            error: handoff?.ok ? null : (handoff?.reason || handoff?.error || null),
          };

          fs.writeFileSync(
            '.deploy-status/publisher-login.json',
            JSON.stringify(status, null, 2) + '\n',
          );
          NODE

      - name: Publish sanitized login status
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/publisher-login.json
          if git diff --cached --quiet; then
            echo "Login status unchanged"
          else
            git commit -m "Update publisher login status"
            git push origin HEAD:main
          fi
