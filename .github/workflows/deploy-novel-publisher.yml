name: Deploy Novel Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/cloudflare-publisher/**'
      - '.github/workflows/deploy-novel-publisher.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation/cloudflare-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$GITHUB_WORKSPACE/wrangler-deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment status for ChatGPT
        if: always()
        working-directory: .
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          export WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' "$GITHUB_WORKSPACE/wrangler-deploy.log" | tail -1 || true)"
          export GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p .deploy-status
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            service: 'novel-auto-publisher',
            outcome: process.env.DEPLOY_OUTCOME,
            run_id: process.env.RUN_ID,
            run_number: process.env.RUN_NUMBER,
            commit_sha: process.env.COMMIT_SHA,
            worker_url: process.env.WORKER_URL || null,
            generated_at_utc: process.env.GENERATED_AT,
          };
          fs.writeFileSync('.deploy-status/novel-publisher.json', JSON.stringify(status, null, 2) + '\n');
          NODE

      - name: Publish deployment status
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/novel-publisher.json
          if git diff --cached --quiet; then
            echo "Deployment status unchanged"
          else
            git commit -m "Update novel publisher deployment status"
            git push origin HEAD:main
          fi

      - name: Verify Worker and Browser Run
        if: steps.deploy.outcome == 'success'
        working-directory: .
        continue-on-error: true
        run: |
          set +e
          WORKER_URL="https://novel-auto-publisher.itisnowornever271.workers.dev"
          OUT="/tmp/publisher-check"
          mkdir -p "$OUT/screenshots"

          probe_json() {
            local name="$1"
            local url="$2"
            curl --silent --show-error --fail --max-time 90 "$url" -o "$OUT/$name.json"
            echo $? > "$OUT/$name.exit"
          }

          probe_png() {
            local name="$1"
            local file="$2"
            local url="$3"
            curl --silent --show-error --fail --max-time 90 "$url" -o "$OUT/screenshots/$file.png"
            echo $? > "$OUT/$name.exit"
          }

          probe_json health "$WORKER_URL/health"
          probe_json kakuyomu-browser "$WORKER_URL/browser-check?site=kakuyomu"
          probe_json nola-browser "$WORKER_URL/browser-check?site=nola"
          probe_png kakuyomu-shot kakuyomu "$WORKER_URL/screenshot?site=kakuyomu"
          probe_png nola-shot nola "$WORKER_URL/screenshot?site=nola"

          export WORKER_URL OUT
          export GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = process.env.OUT;
          const readExit = (name) => {
            try { return Number(fs.readFileSync(path.join(out, `${name}.exit`), 'utf8').trim()); }
            catch { return 999; }
          };
          const readJson = (name) => {
            try { return JSON.parse(fs.readFileSync(path.join(out, `${name}.json`), 'utf8')); }
            catch { return null; }
          };
          const report = {
            worker_url: process.env.WORKER_URL,
            generated_at_utc: process.env.GENERATED_AT,
            health: { exit_code: readExit('health'), response: readJson('health') },
            kakuyomu: {
              browser_check_exit_code: readExit('kakuyomu-browser'),
              browser_check: readJson('kakuyomu-browser'),
              screenshot_exit_code: readExit('kakuyomu-shot'),
              screenshot: 'screenshots/kakuyomu.png',
            },
            nola: {
              browser_check_exit_code: readExit('nola-browser'),
              browser_check: readJson('nola-browser'),
              screenshot_exit_code: readExit('nola-shot'),
              screenshot: 'screenshots/nola.png',
            },
          };
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Publish latest Browser Run check
        if: steps.deploy.outcome == 'success'
        working-directory: .
        run: |
          if [ ! -f /tmp/publisher-check/report.json ]; then
            echo "No publisher check report was generated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publisher-check-temp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/publisher-check/. .
          git add .
          git commit -m "Update latest novel publisher browser check"
          git push --force origin HEAD:publisher-check-latest
