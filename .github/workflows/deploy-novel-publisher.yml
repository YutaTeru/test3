name: Deploy Novel Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/cloudflare-publisher/**'
      - '.github/workflows/deploy-novel-publisher.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation/cloudflare-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$GITHUB_WORKSPACE/wrangler-deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment status for ChatGPT
        if: always()
        working-directory: .
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          export WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' "$GITHUB_WORKSPACE/wrangler-deploy.log" | tail -1 || true)"
          export GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p .deploy-status
          node - <<'NODE'
          const fs = require('fs');
          const status = {
            service: 'novel-auto-publisher',
            outcome: process.env.DEPLOY_OUTCOME,
            run_id: process.env.RUN_ID,
            run_number: process.env.RUN_NUMBER,
            commit_sha: process.env.COMMIT_SHA,
            worker_url: process.env.WORKER_URL || null,
            generated_at_utc: process.env.GENERATED_AT,
          };
          fs.writeFileSync('.deploy-status/novel-publisher.json', JSON.stringify(status, null, 2) + '\n');
          NODE

      - name: Publish deployment status
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/novel-publisher.json
          if git diff --cached --quiet; then
            echo "Deployment status unchanged"
          else
            git commit -m "Update novel publisher deployment status"
            git push origin HEAD:main
          fi

      - name: Verify Worker and Browser Run
        if: steps.deploy.outcome == 'success'
        working-directory: .
        continue-on-error: true
        run: |
          set +e
          WORKER_URL="https://novel-auto-publisher.itisnowornever271.workers.dev"
          OUT="/tmp/publisher-check"
          mkdir -p "$OUT/screenshots"

          HEALTH_CODE="$(curl --silent --show-error --max-time 30 -o "$OUT/health.json" -w '%{http_code}' "$WORKER_URL/health" || echo 000)"
          VERIFY_CODE="$(curl --silent --show-error --max-time 120 -o "$OUT/verify-sites.json" -w '%{http_code}' "$WORKER_URL/verify-sites" || echo 000)"
          SESSION_CODE="$(curl --silent --show-error --max-time 30 -o "$OUT/session-status.json" -w '%{http_code}' "$WORKER_URL/session-status" || echo 000)"

          export WORKER_URL OUT HEALTH_CODE VERIFY_CODE SESSION_CODE
          export GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = process.env.OUT;

          const readJson = (name) => {
            try { return JSON.parse(fs.readFileSync(path.join(out, name), 'utf8')); }
            catch { return null; }
          };

          const health = readJson('health.json');
          const verify = readJson('verify-sites.json');
          const sessions = readJson('session-status.json');

          if (verify) {
            for (const site of ['kakuyomu', 'nola']) {
              const item = verify[site];
              if (item?.screenshotBase64) {
                fs.writeFileSync(
                  path.join(out, 'screenshots', `${site}.jpg`),
                  Buffer.from(item.screenshotBase64, 'base64'),
                );
                item.screenshot = `screenshots/${site}.jpg`;
                delete item.screenshotBase64;
              }
            }
          }

          const report = {
            worker_url: process.env.WORKER_URL,
            generated_at_utc: process.env.GENERATED_AT,
            http: {
              health: process.env.HEALTH_CODE,
              verify_sites: process.env.VERIFY_CODE,
              session_status: process.env.SESSION_CODE,
            },
            health,
            verify,
            sessions,
          };

          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n');
          NODE

      - name: Publish latest Browser Run check
        if: steps.deploy.outcome == 'success'
        working-directory: .
        run: |
          if [ ! -f /tmp/publisher-check/report.json ]; then
            echo "No publisher check report was generated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publisher-check-temp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/publisher-check/. .
          git add .
          git commit -m "Update latest novel publisher browser check"
          git push --force origin HEAD:publisher-check-latest
