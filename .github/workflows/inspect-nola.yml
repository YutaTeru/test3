name: Inspect Nola Authenticated UI

on:
  push:
    branches: [main]
    paths:
      - 'automation/cloudflare-publisher/nola-inspect-trigger.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: automation/cloudflare-publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate ephemeral inspection token
        id: run_token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set temporary Worker inspection secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_TOKEN: ${{ steps.run_token.outputs.token }}
        run: |
          printf '%s\n' "$RUN_TOKEN" | npx wrangler secret put LOGIN_RUN_TOKEN

      - name: Inspect authenticated Nola UI
        id: inspect
        shell: bash
        env:
          RUN_TOKEN: ${{ steps.run_token.outputs.token }}
        run: |
          sleep 5
          HTTP_CODE="$(curl --silent --show-error \
            --max-time 90 \
            -X POST \
            -H "x-login-run-token: $RUN_TOKEN" \
            -o "$GITHUB_WORKSPACE/nola-inspect-raw.json" \
            -w '%{http_code}' \
            "https://novel-auto-publisher.itisnowornever271.workers.dev/nola-inspect")"
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Nola inspection returned HTTP $HTTP_CODE"
          fi

      - name: Remove temporary Worker inspection secret
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '{"LOGIN_RUN_TOKEN":null}\n' | npx wrangler secret bulk || true

      - name: Create sanitized inspection report
        if: always()
        working-directory: .
        env:
          HTTP_CODE: ${{ steps.inspect.outputs.http_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .deploy-status
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const rawPath = path.join(process.env.GITHUB_WORKSPACE, 'nola-inspect-raw.json');
          let raw = null;
          try { raw = JSON.parse(fs.readFileSync(rawPath, 'utf8')); } catch {}

          const keywords = [
            '投稿', '作品', '新規', '作成', '管理', '編集', 'エピソード',
            '小説', '下書き', '公開', 'マイページ', 'ログアウト', '書く'
          ];
          const inputKeywords = ['タイトル', '本文', 'あらすじ', '作品', 'エピソード', '章', '話'];
          const matches = (text, list = keywords) =>
            list.some(k => String(text || '').includes(k));

          const redactPath = (href) => {
            try {
              const u = new URL(href);
              let p = u.pathname;
              p = p.replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/gi, ':id');
              p = p.replace(/\/[0-9]{3,}(?=\/|$)/g, '/:id');
              p = p.replace(/\/[A-Za-z0-9_-]{20,}(?=\/|$)/g, '/:id');
              return p;
            } catch { return null; }
          };

          const genericText = (item) =>
            [item?.text, item?.title, item?.ariaLabel].filter(Boolean).join(' | ');

          const candidateLinks = Array.isArray(raw?.links)
            ? raw.links
                .filter(item => matches(genericText(item)))
                .slice(0, 50)
                .map(item => ({
                  label: genericText(item).slice(0, 120),
                  path_pattern: redactPath(item.href),
                }))
            : [];

          const candidateButtons = Array.isArray(raw?.buttons)
            ? raw.buttons
                .filter(item => matches(genericText(item)))
                .slice(0, 50)
                .map(item => ({
                  label: genericText(item).slice(0, 120),
                  disabled: Boolean(item.disabled),
                }))
            : [];

          const candidateInputs = Array.isArray(raw?.inputs)
            ? raw.inputs
                .filter(item => matches(
                  [item?.name, item?.placeholder, item?.ariaLabel].filter(Boolean).join(' | '),
                  inputKeywords,
                ))
                .slice(0, 50)
                .map(item => ({
                  tag: item.tag,
                  type: item.type,
                  name: item.name,
                  placeholder: item.placeholder,
                  ariaLabel: item.ariaLabel,
                }))
            : [];

          const body = String(raw?.bodyText || '');
          const report = {
            service: 'novel-auto-publisher',
            target: 'nola',
            generated_at_utc: new Date().toISOString(),
            run_id: process.env.RUN_ID,
            run_number: process.env.RUN_NUMBER,
            commit_sha: process.env.COMMIT_SHA,
            http_code: process.env.HTTP_CODE || null,
            ok: Boolean(raw?.ok),
            page: {
              http_status: raw?.httpStatus ?? null,
              title: raw?.title || null,
              path_pattern: redactPath(raw?.finalUrl),
            },
            auth_indicators: {
              logout_text_present: body.includes('ログアウト'),
              mypage_text_present: body.includes('マイページ'),
              login_text_present: body.includes('ログイン'),
            },
            counts: {
              links: Array.isArray(raw?.links) ? raw.links.length : 0,
              buttons: Array.isArray(raw?.buttons) ? raw.buttons.length : 0,
              inputs: Array.isArray(raw?.inputs) ? raw.inputs.length : 0,
              content_editables: Array.isArray(raw?.contentEditables) ? raw.contentEditables.length : 0,
            },
            candidate_links: candidateLinks,
            candidate_buttons: candidateButtons,
            candidate_inputs: candidateInputs,
            error: raw?.ok ? null : (raw?.error || 'inspection failed'),
          };

          fs.writeFileSync(
            '.deploy-status/nola-inspect.json',
            JSON.stringify(report, null, 2) + '\n',
          );
          NODE
          rm -f "$GITHUB_WORKSPACE/nola-inspect-raw.json"

      - name: Publish sanitized inspection status
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/nola-inspect.json
          if git diff --cached --quiet; then
            echo "Nola inspection status unchanged"
          else
            git commit -m "Update sanitized Nola inspection status"
            git push origin HEAD:main
          fi
